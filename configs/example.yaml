app:
  name: "Product Service"
  version: "1.0"
  environment: "local"

postgres:
  dsn: "POSTGRES_DSN"           # ← placeholder, заменится из env
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

server:
  http:
    port: 8080
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 60s

    basic_auth:
      enabled: true
      username: "BASIC_AUTH_USER"   # ← placeholder
      password: "BASIC_AUTH_PASS"   # ← placeholder

  graceful_shutdown: 15s

logger:
  level: debug
  format: text
  output: stdout
